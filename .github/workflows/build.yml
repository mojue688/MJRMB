name: Build Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      # 1.编译看门狗子程序，输出 dist/看门狗.exe
      - name: Build watchdog subprogram (看门狗.exe)
        run: pyinstaller --onefile --windowed -i icon.png --name "看门狗" watchdog.py

      # 2.编译主程序【网络安全锁.exe】
      # Windows PowerShell不支持反引号换行，整行写全部参数，避免参数丢失
      - name: Build main program (网络安全锁.exe)
        run: pyinstaller --onefile --windowed -i icon.png --name "网络安全锁" --add-data "bg.png;." --add-data "badge.png;." --add-data "info.png;." --add-data "version.txt;." --add-binary "dist/看门狗.exe;." popup.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 网络安全锁-exe
          path: dist/网络安全锁.exe
