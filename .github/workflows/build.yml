name: Build Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 🟢第一步：先编译 watchdog.py 生成 watchdog.exe
      - name: Build watchdog sub program
        run: |
          pyinstaller --onefile watchdog.py
        # 产物输出到 dist/watchdog.exe

      # 🔴重点：打包popup主程序，同时把 watchdog.exe 和 bg.png 全部打进exe资源
      - name: Build popup main program
        run: |
          pyinstaller --onefile --windowed `
            --add-data "bg.png;." `
            --add-binary "dist/watchdog.exe;." `
            popup.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/popup.exe
