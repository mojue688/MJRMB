name: Build Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      # 第一步：编译 watchdog.py，输出名称：看门狗.exe，指定icon.png图标
      - name: Build watchdog subprogram (看门狗.exe)
        run: |
          pyinstaller --onefile --windowed -i icon.png --name "看门狗" watchdog.py

      # 第二步：编译主程序 popup.py，输出：网络安全锁.exe
      # 嵌入资源：图片全部、version.txt；二进制嵌入 dist/看门狗.exe
      - name: Build main program (网络安全锁.exe)
        run: |
          pyinstaller --onefile --windowed `
            -i icon.png `
            --name "网络安全锁" `
            --add-data "bg.png;." `
            --add-data "badge.png;." `
            --add-data "info.png;." `
            --add-data "version.txt;." `
            --add-binary "dist/看门狗.exe;." `
            popup.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 网络安全锁-exe
          path: dist/网络安全锁.exe
